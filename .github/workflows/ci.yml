name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # The version is computed from commit subjects, so a subject release-please
  # cannot parse is a change that silently never ships.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          base=$BASE
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse --verify --quiet HEAD~1 || true)
          fi
          range=HEAD
          if [ -n "$base" ]; then
            range="$base..HEAD"
          fi
          rc=0
          for sha in $(git rev-list "$range"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            if ! .githooks/commit-msg /tmp/msg; then
              echo "  in commit $sha" >&2
              rc=1
            fi
          done
          exit $rc
