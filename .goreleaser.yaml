version: 2

project_name: claude-afterlife

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

release:
  # release-please has already created the release for this tag; upload the
  # binaries onto it instead of failing on the collision.
  mode: append

changelog:
  # CHANGELOG.md is release-please's job, generated from the same commits.
  disable: true
